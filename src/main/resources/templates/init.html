<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Iniciar Proceso BS.sql</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 40px;
            color: #333;
        }
        h1 {
            color: #4CAF50;
        }
        p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 20px;
            resize: vertical;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Interfaz para Iniciar el Proceso de BS.sql</h1>
    <p th:text="${message}"></p>
    <textarea th:text="${logs != null ? #strings.listJoin(logs, '\n') : ''}" readonly placeholder="Logs del proceso aparecerán aquí..."></textarea>
    <form action="/init" method="post">
        <button type="submit">Iniciar Proceso</button>
    </form>
</body>
</html>
